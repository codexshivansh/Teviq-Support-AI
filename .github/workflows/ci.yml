name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:chat-resource-bounds
      - run: npm run test:response-integrity
      - run: npm run test:whatsapp-webhook-security
      - run: npm run test:channel-inbox
      - run: npm run test:provider-delivery-status
      - run: npm run test:conversation-delivery-status
      - run: npm run test:reply-window
      - run: npm run test:channel-send-window
      - run: npm run test:support-data-erasure
      - run: npm run test:teviq-launch-routing
      - run: npm run test:faq-sync
      - run: npm run test:escalation
      - run: npm run test:channel-review-access
      - run: npm run test:retrieval-regression
      - run: npm run test:widget-session-security
      - run: npm run test:brand-sales-scope
      - run: npm run test:groq-only
      - run: npm run test:ai-trial
      - run: npm run test:ai-access-sql
      - run: npm run test:analytics
      - run: npm run test:knowledge-storage
      - run: npm run test:memory
      - run: npm run test:brain
      - run: npm run test:order-security
      - run: npm run test:shopify-oauth
      - run: npm run test:shopify-webhooks
      - run: npm run test:production-hardening
